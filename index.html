<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Semantic Dissolution Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #38bdf8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header { text-align: center; margin-bottom: 12px; }
        h1 { font-size: 1.15rem; letter-spacing: 2px; color: #f8fafc; }
        p.subtitle { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

        #camera-wrapper {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .switch-container {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 440px;
            margin-top: 12px;
        }
        .mode-btn {
            flex: 1;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #0369a1;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 440px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        #capture-btn { background: #0d9488; }

        #output-container {
            width: 100%;
            max-width: 440px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .output-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #text-output {
            width: 100%;
            height: 180px;
            background: #020617;
            border: 1px solid #0369a1;
            border-radius: 8px;
            color: #22d3ee;
            font-family: 'Noto Sans Tifinagh', monospace;
            font-size: 11px;
            line-height: 15px;
            word-break: break-all;
            overflow-y: auto;
            padding: 10px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SEMANTIC DISSOLUTION CAMERA</h1>
        <p class="subtitle">Pixel-to-Script Translator</p>
    </header>

    <div id="camera-wrapper">
        <video id="camera-view" autoplay playsinline muted></video>
    </div>

    <!-- 文字体系切り替え -->
    <div class="switch-container">
        <button id="mode-tifinagh" class="mode-btn active">ⵜⵉⴼⵉⵏⴰⵖ (Tifinagh)</button>
        <button id="mode-hiragana" class="mode-btn">ひらがな (Hiragana)</button>
    </div>

    <div class="controls">
        <button id="start-btn" class="action-btn">カメラを起動</button>
        <button id="capture-btn" class="action-btn" disabled>シャッターを切る</button>
    </div>

    <div id="output-container">
        <span class="output-label" id="output-label">Tifinagh Binary Stream</span>
        <div id="text-output">Ready. カメラを起動してください。</div>
    </div>

    <script>
        // 1. 自立した32文字（5ビット Base32）テーブル
        const TIFINAGH_32 = [
            'ⴰ', 'ⴱ', 'ⴳ', 'ⴷ', 'ⴹ', 'ⴻ', 'ⴼ', 'ⴽ',
            'ⵀ', 'ⵃ', 'ⵄ', 'ⵅ', 'ⵇ', 'ⵉ', 'ⵊ', 'ⵍ',
            'ⵎ', 'ⵏ', 'ⵓ', 'ⵔ', 'ⵕ', 'ⵖ', 'ⵙ', 'ⵚ',
            'ⵛ', 'ⵜ', 'ⵟ', 'ⵡ', 'ⵢ', 'ⵣ', 'ⵥ', 'ⵠ'
        ];

        const HIRAGANA_32 = [
            'あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く',
            'け', 'こ', 'さ', 'し', 'す', 'せ', 'そ', 'た',
            'ち', 'つ', 'て', 'と', 'な', 'に', 'ぬ', 'ね',
            'の', 'は', 'ひ', 'ふ', 'へ', 'ほ', 'ま', 'み'
        ];

        let currentMode = 'tifinagh'; // 'tifinagh' | 'hiragana'

        const video = document.getElementById('camera-view');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const outputDisplay = document.getElementById('text-output');
        const outputLabel = document.getElementById('output-label');
        const modeTifinaghBtn = document.getElementById('mode-tifinagh');
        const modeHiraganaBtn = document.getElementById('mode-hiragana');

        // モード切り替えイベント
        modeTifinaghBtn.addEventListener('click', () => {
            currentMode = 'tifinagh';
            modeTifinaghBtn.classList.add('active');
            modeHiraganaBtn.classList.remove('active');
            outputLabel.innerText = 'Tifinagh Binary Stream';
            outputDisplay.style.fontFamily = "'Noto Sans Tifinagh', monospace";
        });

        modeHiraganaBtn.addEventListener('click', () => {
            currentMode = 'hiragana';
            modeHiraganaBtn.classList.add('active');
            modeTifinaghBtn.classList.remove('active');
            outputLabel.innerText = 'Hiragana Binary Stream';
            outputDisplay.style.fontFamily = "monospace";
        });

        // カメラ起動
        startBtn.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                startBtn.style.display = 'none';
                captureBtn.disabled = false;
                outputDisplay.innerText = 'カメラ待機中：シャッターを押すと変換・保存が実行されます';
            } catch (err) {
                outputDisplay.innerText = 'エラー: カメラへのアクセスが拒否されました。\n' + err.message;
            }
        });

        // 5ビット単位のエンコード処理（Base32）
        function encodeBase32(uint8Array, table) {
            let encoded = '';
            let bitBuffer = 0;
            let bitCount = 0;

            for (let i = 0; i < uint8Array.length; i++) {
                bitBuffer = (bitBuffer << 8) | uint8Array[i];
                bitCount += 8;

                while (bitCount >= 5) {
                    bitCount -= 5;
                    const index = (bitBuffer >> bitCount) & 0x1F;
                    encoded += table[index];
                }
            }

            if (bitCount > 0) {
                const index = (bitBuffer << (5 - bitCount)) & 0x1F;
                encoded += table[index];
            }

            return encoded;
        }

        // シャッター & 同時保存
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth || !video.videoHeight) return;

            const timestamp = Date.now();
            const table = (currentMode === 'tifinagh') ? TIFINAGH_32 : HIRAGANA_32;

            // 1. 通常写真の保存 (JPEG)
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = video.videoWidth;
            fullCanvas.height = video.videoHeight;
            const fullCtx = fullCanvas.getContext('2d');
            fullCtx.drawImage(video, 0, 0);

            fullCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `photo_${timestamp}.jpg`;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.9);

            // 2. 48x36 解像度への縮小 & 輝度（Grayscale）変換
            const gridW = 48;
            const gridH = 36;
            const microCanvas = document.createElement('canvas');
            microCanvas.width = gridW;
            microCanvas.height = gridH;
            const microCtx = microCanvas.getContext('2d');

            microCtx.drawImage(video, 0, 0, gridW, gridH);
            const rawPixels = microCtx.getImageData(0, 0, gridW, gridH).data;

            const grayBytes = new Uint8Array(gridW * gridH);
            for (let i = 0, j = 0; i < rawPixels.length; i += 4, j++) {
                const r = rawPixels[i];
                const g = rawPixels[i + 1];
                const b = rawPixels[i + 2];
                grayBytes[j] = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
            }

            // 文字列変換
            const encodedText = encodeBase32(grayBytes, table);
            outputDisplay.innerText = encodedText;

            // テキストファイル (.txt) 保存
            const textBlob = new Blob([encodedText], { type: 'text/plain;charset=utf-8' });
            const textUrl = URL.createObjectURL(textBlob);
            const textLink = document.createElement('a');
            textLink.href = textUrl;
            textLink.download = `${currentMode}_${timestamp}.txt`;
            textLink.click();
            URL.revokeObjectURL(textUrl);
        });
    </script>
</body>
</html>
