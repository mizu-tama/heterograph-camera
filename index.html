<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeteroGraph Camera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #38bdf8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        header { text-align: center; margin-bottom: 12px; }
        h1 { font-size: 1.15rem; letter-spacing: 2px; color: #f8fafc; }
        p.subtitle { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

        #camera-wrapper {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4 / 3;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .switch-container {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 440px;
            margin-top: 12px;
        }
        .mode-btn {
            flex: 1;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 4px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #0369a1;
            color: #ffffff;
            border-color: #38bdf8;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 440px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        #capture-btn { background: #0d9488; }

        #output-container {
            width: 100%;
            max-width: 440px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .output-box-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .output-label {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .text-output {
            width: 100%;
            height: 130px;
            background: #020617;
            border: 1px solid #0369a1;
            border-radius: 8px;
            color: #22d3ee;
            font-size: 11px;
            line-height: 15px;
            word-break: break-all;
            overflow-y: auto;
            padding: 10px;
            letter-spacing: 1.5px;
        }
        .tifinagh-font {
            font-family: 'Noto Sans Tifinagh', monospace;
        }
        .hiragana-font {
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>HETEROGRAPH CAMERA</h1>
        <p class="subtitle">Pixel-to-Script Translator</p>
    </header>

    <div id="camera-wrapper">
        <video id="camera-view" autoplay playsinline muted></video>
    </div>

    <!-- 文字体系切り替え（3モード） -->
    <div class="switch-container">
        <button id="mode-tifinagh" class="mode-btn active">ⵜⵉⴼⵉⵏⴰⵖ</button>
        <button id="mode-hiragana" class="mode-btn">ひらがな</button>
        <button id="mode-both" class="mode-btn">両方 (Dual)</button>
    </div>

    <div class="controls">
        <button id="start-btn" class="action-btn">カメラを起動</button>
        <button id="capture-btn" class="action-btn" disabled>シャッターを切る</button>
    </div>

    <!-- 出力コンテナ（個別ボックス） -->
    <div id="output-container">
        <div id="tifinagh-wrap" class="output-box-wrap">
            <span class="output-label">Tifinagh Binary Stream</span>
            <div id="tifinagh-output" class="text-output tifinagh-font">Ready. カメラを起動してください。</div>
        </div>

        <div id="hiragana-wrap" class="output-box-wrap" style="display: none;">
            <span class="output-label">Hiragana Binary Stream</span>
            <div id="hiragana-output" class="text-output hiragana-font">Ready. カメラを起動してください。</div>
        </div>
    </div>

    <script>
        // ティフィナグ文字 分散配列（Base32 / 5bit / 32文字）
        // 標準文字31 + アルジェリアのタマジクト語（カビル方言など）で公式に定められている標準子音「ⵠ」（U+2D60 / Yav）
        // 写真の輝度分布（暗部偏重）と言語コーパスの出現頻度を一致させたマッピング
        const TIFINAGH_32 = [
            // [0〜3] 最暗部・黒潰れ（超低頻度・強勢子音）
            'ⵠ', 'ⵥ', 'ⵕ', 'ⴹ',
            // [4〜7] シャドウ部（低頻度子音）
            'ⵚ', 'ⵟ', 'ⵛ', 'ⵣ',
            // [8〜11] 中間暗部（中頻度〜高頻度への立ち上がり）
            'ⴱ', 'ⵃ', 'ⵎ', 'ⵙ',
            // [12〜17] ヒストグラムのピーク：主要被写体域（最頻出のコア文字）
            'ⴰ', 'ⵜ', 'ⵏ', 'ⵉ', 'ⵍ', 'ⵔ',
            // [18〜23] 中間明部（高頻度母音・子音の緩やかな下り）
            'ⴷ', 'ⵓ', 'ⴻ', 'ⵢ', 'ⵡ', 'ⴼ',
            // [24〜27] ハイライト部（中〜低頻度子音）
            'ⴽ', 'ⴳ', 'ⵖ', 'ⵇ',
            // [28〜31] 最明部・白飛び（超低頻度・借用子音）
            'ⵅ', 'ⵊ', 'ⵄ', 'ⵀ'
        ];

        const HIRAGANA_32 = [
            'あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く',
            'け', 'こ', 'さ', 'し', 'す', 'せ', 'そ', 'た',
            'ち', 'つ', 'て', 'と', 'な', 'に', 'ぬ', 'ね',
            'の', 'は', 'ひ', 'ふ', 'へ', 'ほ', 'ま', 'み'
        ];

        let currentMode = 'tifinagh'; // 'tifinagh' | 'hiragana' | 'both'

        const video = document.getElementById('camera-view');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');

        const modeTifinaghBtn = document.getElementById('mode-tifinagh');
        const modeHiraganaBtn = document.getElementById('mode-hiragana');
        const modeBothBtn = document.getElementById('mode-both');

        const tifinaghWrap = document.getElementById('tifinagh-wrap');
        const hiraganaWrap = document.getElementById('hiragana-wrap');
        const tifinaghOutput = document.getElementById('tifinagh-output');
        const hiraganaOutput = document.getElementById('hiragana-output');

        // モード変更処理
        function setMode(mode) {
            currentMode = mode;
            modeTifinaghBtn.classList.toggle('active', mode === 'tifinagh');
            modeHiraganaBtn.classList.toggle('active', mode === 'hiragana');
            modeBothBtn.classList.toggle('active', mode === 'both');

            if (mode === 'tifinagh') {
                tifinaghWrap.style.display = 'flex';
                hiraganaWrap.style.display = 'none';
            } else if (mode === 'hiragana') {
                tifinaghWrap.style.display = 'none';
                hiraganaWrap.style.display = 'flex';
            } else if (mode === 'both') {
                tifinaghWrap.style.display = 'flex';
                hiraganaWrap.style.display = 'flex';
            }
        }

        modeTifinaghBtn.addEventListener('click', () => setMode('tifinagh'));
        modeHiraganaBtn.addEventListener('click', () => setMode('hiragana'));
        modeBothBtn.addEventListener('click', () => setMode('both'));

        // カメラ起動
        startBtn.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                startBtn.style.display = 'none';
                captureBtn.disabled = false;
                tifinaghOutput.innerText = 'カメラ待機中：シャッターを押すと変換・保存が実行されます';
                hiraganaOutput.innerText = 'カメラ待機中：シャッターを押すと変換・保存が実行されます';
            } catch (err) {
                const errMsg = 'エラー: カメラへのアクセスが拒否されました。\n' + err.message;
                tifinaghOutput.innerText = errMsg;
                hiraganaOutput.innerText = errMsg;
            }
        });

        // 5ビット単位のエンコード処理（Base32）
        function encodeBase32(uint8Array, table) {
            let encoded = '';
            let bitBuffer = 0;
            let bitCount = 0;

            for (let i = 0; i < uint8Array.length; i++) {
                bitBuffer = (bitBuffer << 8) | uint8Array[i];
                bitCount += 8;

                while (bitCount >= 5) {
                    bitCount -= 5;
                    const index = (bitBuffer >> bitCount) & 0x1F;
                    encoded += table[index];
                }
            }

            if (bitCount > 0) {
                const index = (bitBuffer << (5 - bitCount)) & 0x1F;
                encoded += table[index];
            }

            return encoded;
        }

        // テキストファイルのダウンロード補助関数
        function saveTextFile(text, filename) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);
        }

        // シャッター & 保存
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth || !video.videoHeight) return;

            const timestamp = Date.now();

            // 1. 通常写真の保存 (JPEG)
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = video.videoWidth;
            fullCanvas.height = video.videoHeight;
            const fullCtx = fullCanvas.getContext('2d');
            fullCtx.drawImage(video, 0, 0);

            fullCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `photo_${timestamp}.jpg`;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.9);

            // 2. 48x36 解像度への縮小 & 輝度（Grayscale）変換
            const gridW = 48;
            const gridH = 36;
            const microCanvas = document.createElement('canvas');
            microCanvas.width = gridW;
            microCanvas.height = gridH;
            const microCtx = microCanvas.getContext('2d');

            microCtx.drawImage(video, 0, 0, gridW, gridH);
            const rawPixels = microCtx.getImageData(0, 0, gridW, gridH).data;

            const grayBytes = new Uint8Array(gridW * gridH);
            for (let i = 0, j = 0; i < rawPixels.length; i += 4, j++) {
                const r = rawPixels[i];
                const g = rawPixels[i + 1];
                const b = rawPixels[i + 2];
                grayBytes[j] = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
            }

            // 3. モードに応じた文字生成と保存
            if (currentMode === 'tifinagh' || currentMode === 'both') {
                const tifinaghText = encodeBase32(grayBytes, TIFINAGH_32);
                tifinaghOutput.innerText = tifinaghText;
                saveTextFile(tifinaghText, `tifinagh_${timestamp}.txt`);
            }

            if (currentMode === 'hiragana' || currentMode === 'both') {
                const hiraganaText = encodeBase32(grayBytes, HIRAGANA_32);
                hiraganaOutput.innerText = hiraganaText;
                saveTextFile(hiraganaText, `hiragana_${timestamp}.txt`);
            }
        });
    </script>
</body>
</html>
