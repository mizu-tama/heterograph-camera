<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeteroGraph Darkroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+Tifinagh&family=Noto+Serif+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <style id="page-print-style">
        @page { size: A4 portrait; margin: 0; }
    </style>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #0f172a;
            --bg-input: #020617;
            --border: #1e293b;
            --border-focus: #0284c7;
            --accent: #38bdf8;
            --accent-btn: #0284c7;
            --accent-btn-hover: #0369a1;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* 全体スクロールを禁止 */
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.25rem;
            letter-spacing: 3px;
            font-weight: 600;
        }
        p.subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: calc(100vh - 80px);
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            align-items: stretch;
            min-height: 0; /* flex/grid 内でのオーバーフロー計算用 */
        }
        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .container { grid-template-columns: 1fr; height: auto; }
        }

        /* 左パネル：独立縦スクロール */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            max-height: 100%;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* フォームコントロール */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        select, input[type="text"] {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.8rem;
            outline: none;
            width: 100%;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--border-focus);
        }
        .row-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .slider-row {
            display: grid;
            grid-template-columns: 70px 1fr 45px;
            gap: 8px;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ドロップゾーン */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            background: var(--bg-input);
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }
        .drop-zone p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .drop-zone span.highlight {
            color: var(--accent);
            font-weight: 600;
        }

        /* ステータスバッジ */
        .status-badge {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge span.val {
            color: var(--accent);
            font-family: monospace;
        }

        /* カラーセレクター */
        .color-preset-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-chip {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-chip:hover { transform: scale(1.15); }
        .color-chip.active {
            border: 2px solid var(--accent);
            transform: scale(1.15);
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        /* ボタン群 */
        button, label.file-btn {
            background: var(--accent-btn);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            transition: background 0.2s;
        }
        button:hover, label.file-btn:hover { background: var(--accent-btn-hover); }
        button.secondary, label.file-btn.secondary {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        button.secondary:hover, label.file-btn.secondary:hover {
            background: #334155;
            color: #ffffff;
        }
        button.print-btn {
            background: #0d9488;
        }
        button.print-btn:hover {
            background: #0f766e;
        }
        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        /* ==========================================================================
           作業台 ＆ 用紙シート (Workbench & Print Sheet Preview)
           ========================================================================== */
        .workbench-wrapper {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 表示倍率切り替えバー */
        .view-controls {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 10;
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }
        .view-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .view-btn.active {
            background: var(--accent-btn);
            color: #ffffff;
        }

        .workbench {
            background: #050811;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
            overflow: auto; /* 実寸時は作業台内をスクロール */
            position: relative;
        }

        /* 用紙シートの変形コンテナ */
        .paper-transform-wrap {
            transition: transform 0.2s ease;
            transform-origin: top center;
            display: flex;
            justify-content: center;
        }

        /* 用紙シート（画面表示用シミュレーター） */
        .paper-sheet {
            background: #f8f6f0; /* デフォルト：生成り */
            color: #1c1917;      /* デフォルト：墨色 */
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.2s ease, color 0.2s ease, width 0.2s ease, height 0.2s ease;
            position: relative;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* 用紙サイズ定義（実寸固定） */
        .paper-sheet.size-a4-p { width: 595px; height: 842px; } /* A4 縦 */
        .paper-sheet.size-a4-l { width: 842px; height: 595px; } /* A4 横 */
        .paper-sheet.size-hagaki-p { width: 378px; height: 560px; } /* ハガキ 縦 */
        .paper-sheet.size-hagaki-l { width: 560px; height: 378px; } /* ハガキ 横 */

        /* 本文組版コンテナ（枠外はみ出しを視覚化） */
        #output-text {
            width: 100%;
            height: 100%;
            white-space: pre-wrap;
            word-break: break-all;
            outline: none;
            box-sizing: border-box;
            overflow: visible; /* 紙枠からはみ出た文字が見えるようにする */
        }

        /* 書体クラス定義 */
        .font-shippori { font-family: 'Shippori Mincho', 'Noto Serif JP', serif; }
        .font-noto-serif { font-family: 'Noto Serif JP', serif; }
        .font-biz-mincho { font-family: 'BIZ UDPMincho', 'Noto Serif JP', serif; }
        .font-noto-sans { font-family: 'Noto Sans JP', -apple-system, sans-serif; }
        .font-mono { font-family: monospace; }
        .font-tifinagh { font-family: 'Noto Sans Tifinagh', monospace; }

        /* 組方向クラス定義 */
        .dir-horizontal {
            writing-mode: horizontal-tb;
        }
        .dir-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            line-height: 2.2 !important;
        }

        input[type="file"] { display: none; }

        /* ==========================================================================
           印刷専用スタイル (@media print)
           ========================================================================== */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }
            header, .panel, .view-controls, .section-title {
                display: none !important;
            }
            .container {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                height: auto !important;
            }
            .workbench-wrapper {
                display: block !important;
                height: auto !important;
            }
            .workbench {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                min-height: auto !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            .paper-transform-wrap {
                transform: scale(1) !important;
                display: block !important;
            }
            .paper-sheet {
                background: transparent !important; /* 実際の印刷用紙の地色を活かすため無色 */
                box-shadow: none !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                page-break-after: avoid !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>HETEROGRAPH DARKROOM</h1>
        <p class="subtitle">RAW Text Developer & Typesetter</p>
    </header>

    <div class="container">
        <!-- 左ペイン: 操作・仕立てパネル -->
        <div class="panel">
            <div class="section-title">1. Raw Input</div>
            <div class="drop-zone" id="drop-zone">
                <p>RAWテキスト（.txt）をドロップ<br>または <span class="highlight">ファイルを選択</span></p>
                <input type="file" id="raw-file-input" accept=".txt">
            </div>

            <div class="status-badge">
                <span>検出モード:</span>
                <span class="val" id="detected-mode">-</span>
            </div>

            <div class="section-title">2. Developing Profile</div>
            <div class="status-badge">
                <span>Profile:</span>
                <span class="val" id="profile-name">Standard (Random)</span>
            </div>
            <div class="row-group">
                <label for="profile-file-input" class="file-btn secondary" style="flex: 1;">JSON読込</label>
                <input type="file" id="profile-file-input" accept=".json">
                <button id="reset-profile-btn" class="secondary" style="flex: 1;">リセット</button>
            </div>

            <div class="section-title">3. Paper & Format</div>
            <div class="control-group">
                <label class="control-label">用紙サイズ / 向き</label>
                <select id="select-paper-size">
                    <option value="size-a4-p">A4 縦 (Portrait 210×297mm)</option>
                    <option value="size-a4-l">A4 横 (Landscape 297×210mm)</option>
                    <option value="size-hagaki-p">ハガキ 縦 (Portrait 100×148mm)</option>
                    <option value="size-hagaki-l">ハガキ 横 (Landscape 148×100mm)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">余白 (Margin)</label>
                <select id="select-margin">
                    <option value="15mm">狭め (15mm - データ集積風)</option>
                    <option value="25mm" selected>標準 (25mm - 書籍・論文風)</option>
                    <option value="35mm">広め (35mm - ギャラリー展示風)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">用紙プレビュー色 (画面確認用)</label>
                <select id="select-paper-bg">
                    <option value="#f8f6f0" selected>生成り (風合い紙・アラベール風)</option>
                    <option value="#ffffff">純白 (アート紙・コート紙風)</option>
                    <option value="#e7dec8">クラフト (未晒クラフト紙風)</option>
                    <option value="#090d16">暗室ダーク (印画紙・モニター風)</option>
                </select>
            </div>

            <div class="section-title">4. Typography & Ink</div>
            <div class="control-group">
                <label class="control-label">書体 (Font Family)</label>
                <select id="select-font">
                    <option value="font-shippori" selected>しっぽり明朝 (墨だまり・古典)</option>
                    <option value="font-noto-serif">源ノ明朝 / Noto Serif (標準)</option>
                    <option value="font-biz-mincho">BIZ UDP明朝 (高視認性)</option>
                    <option value="font-noto-sans">源ノ角ゴシック / Noto Sans</option>
                    <option value="font-mono">等幅 (Courier / Monospace)</option>
                    <option value="font-tifinagh">Noto Sans Tifinagh</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">組方向 (Writing Direction)</label>
                <select id="select-direction">
                    <option value="dir-horizontal" selected>横組 (Horizontal)</option>
                    <option value="dir-vertical">縦組 (Vertical RL)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">インク色 (文字色)</label>
                <div class="color-preset-group">
                    <div class="color-chip active" style="background: #1c1917;" data-color="#1c1917" title="墨色 (Carbon)"></div>
                    <div class="color-chip" style="background: #000000;" data-color="#000000" title="漆黒 (Pure Black)"></div>
                    <div class="color-chip" style="background: #1e3a5f;" data-color="#1e3a5f" title="藍色 (Indigo / 青焼き)"></div>
                    <div class="color-chip" style="background: #3d2314;" data-color="#3d2314" title="焦茶 (Sepia)"></div>
                    <div class="color-chip" style="background: #7c2d12;" data-color="#7c2d12" title="茜色 (Terracotta)"></div>
                    <div class="color-chip" style="background: #0284c7;" data-color="#0284c7" title="暗室シアン (Cyan)"></div>
                    <div class="color-chip" style="background: #ffffff;" data-color="#ffffff" title="白抜き (White)"></div>
                    <input type="color" id="custom-ink-color" value="#1c1917" title="カスタムカラー選択">
                </div>
            </div>

            <div class="control-group">
                <div class="slider-row">
                    <span>サイズ:</span>
                    <input type="range" id="slider-size" min="6" max="18" value="8.5" step="0.5">
                    <span id="val-size">8.5pt</span>
                </div>
                <div class="slider-row">
                    <span>行送り:</span>
                    <input type="range" id="slider-leading" min="12" max="28" value="16">
                    <span id="val-leading">1.6</span>
                </div>
                <div class="slider-row">
                    <span>字間:</span>
                    <input type="range" id="slider-tracking" min="0" max="8" value="1">
                    <span id="val-tracking">1px</span>
                </div>
            </div>

            <div class="section-title">5. Actions</div>
            <button id="develop-btn" disabled>現像を実行 (Develop)</button>
            <button id="print-btn" class="print-btn">印刷 / PDF保存 (Print)</button>
            <button id="export-txt-btn" class="secondary" disabled>現像テキストを保存 (.txt)</button>
        </div>

        <!-- 右ペイン: 作業台 ＆ 用紙シート -->
        <div class="workbench-wrapper">
            <div class="view-controls">
                <button type="button" class="view-btn active" id="btn-view-fit">全体表示 (Fit)</button>
                <button type="button" class="view-btn" id="btn-view-actual">実寸 (100%)</button>
            </div>
            <div class="workbench" id="workbench">
                <div class="paper-transform-wrap" id="paper-transform-wrap">
                    <div id="paper-sheet" class="paper-sheet size-a4-p font-shippori dir-horizontal" style="padding: 25mm;">
                        <div id="output-text" contenteditable="false">RAWテキストファイルを読み込んでください。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. CORE DEVELOPER ENGINE (純粋な現像ロジック・DOM非依存)
           - DOMや画面の状態を持たない純粋な文字列現像エンジン
           - Node.js や CLI スクリプトへもこのクラスをそのまま移植可能
           ========================================================================== */
        class HeteroGraphCore {
            /**
             * シード付き疑似乱数生成器 (Mulberry32)
             */
            static mulberry32(a) {
                return function() {
                    let t = a += 0x6D2B79F5;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            /**
             * 乱数生成器のファクトリ関数
             */
            static createRng(seed) {
                if (seed !== null && seed !== undefined) {
                    return this.mulberry32(Number(seed));
                }
                return Math.random;
            }

            /**
             * メイン現像エントリーポイント
             */
            static develop(rawText, mode, profile) {
                const rng = this.createRng(profile.seed);

                if (mode === 'hiragana') {
                    return this.developHiragana(rawText, profile.hiragana, rng);
                } else if (mode === 'tifinagh') {
                    return this.developTifinagh(rawText, profile.tifinagh, rng);
                }
                return rawText;
            }

            /**
             * ひらがな現像ロジック（行頭禁則処理付き）
             */
            static developHiragana(raw, conf, rng) {
                const chars = Array.from(raw);
                let formatted = '';
                let sentenceLen = 0;
                let clauseLen = 0;

                const commaTriggers = new Set(conf.clause.triggers);
                const periodTriggers = new Set(conf.sentence.triggers);
                const forbiddenHead = new Set(conf.forbiddenHead || []);

                for (let i = 0; i < chars.length; i++) {
                    const char = chars[i];
                    formatted += char;
                    sentenceLen++;
                    clauseLen++;

                    const nextChar = chars[i + 1];

                    // 句点・改行判定
                    const isPeriodTrigger = periodTriggers.has(char) && (rng() <= (conf.sentence.triggerChance ?? 1.0));
                    if (sentenceLen >= conf.sentence.minLen && (isPeriodTrigger || sentenceLen >= conf.sentence.maxLen)) {
                        // 行頭禁則処理: 次の文字が禁則文字なら改行を1文字見送る
                        if (nextChar && forbiddenHead.has(nextChar) && sentenceLen < conf.sentence.maxLen + 5) {
                            continue;
                        }
                        formatted += '。\n';
                        sentenceLen = 0;
                        clauseLen = 0;
                    }
                    // 読点判定
                    else if (clauseLen >= conf.clause.minLen && (commaTriggers.has(char) || clauseLen >= conf.clause.maxLen)) {
                        if (rng() <= (conf.clause.triggerChance ?? 1.0)) {
                            formatted += '、';
                            clauseLen = 0;
                        }
                    }
                }

                if (!formatted.endsWith('。\n') && !formatted.endsWith('。')) {
                    formatted += '。';
                }
                return formatted;
            }

            /**
             * ティフィナグ現像ロジック
             */
            static developTifinagh(raw, conf, rng) {
                const chars = Array.from(raw);
                let formatted = '';
                let sentenceLen = 0;
                let wordLen = 0;

                const wordTriggers = new Set(conf.word.triggers);
                const periodTriggers = new Set(conf.sentence.triggers);

                for (let i = 0; i < chars.length; i++) {
                    const char = chars[i];
                    formatted += char;
                    sentenceLen++;
                    wordLen++;

                    // ピリオド＋改行判定
                    const isPeriodTrigger = periodTriggers.has(char) && (rng() <= (conf.sentence.triggerChance ?? 1.0));
                    if (sentenceLen >= conf.sentence.minLen && (isPeriodTrigger || sentenceLen >= conf.sentence.maxLen)) {
                        formatted += '.\n';
                        sentenceLen = 0;
                        wordLen = 0;
                    }
                    // スペース（単語区切り）判定
                    else if (wordLen >= conf.word.minLen && (wordTriggers.has(char) || wordLen >= conf.word.maxLen)) {
                        if (rng() <= (conf.word.triggerChance ?? 1.0)) {
                            formatted += ' ';
                            wordLen = 0;
                        }
                    }
                }

                if (!formatted.endsWith('.\n') && !formatted.endsWith('.')) {
                    formatted += '.';
                }
                return formatted;
            }
        }


        /* ==========================================================================
           2. DARKROOM UI & CONTROLLER (画面制御・イベント処理)
           - ユーザー操作、ファイル入出力、DOMレンダリングを担当
           ========================================================================== */

        // デフォルト現像プロファイル（標準）
        const DEFAULT_PROFILE = {
            profileName: "Standard (Random)",
            seed: null,
            hiragana: {
                clause: { minLen: 8, maxLen: 25, triggers: ['て', 'で', 'に', 'は', 'が', 'の', 'ば', 'と', 'も', 'へ'], triggerChance: 1.0 },
                sentence: { minLen: 30, maxLen: 65, triggers: ['た', 'だ', 'る', 'い', 'す', 'よ', 'っ', 'う', 'ね'], triggerChance: 1.0 },
                forbiddenHead: ['っ', 'ゃ', 'ゅ', 'ょ', 'ん', 'ー']
            },
            tifinagh: {
                word: { minLen: 2, maxLen: 7, triggers: ['ⴰ', 'ⵉ', 'ⵓ', 'ⴻ', 'ⵢ', 'ⵡ'], triggerChance: 1.0 },
                sentence: { minLen: 35, maxLen: 70, triggers: ['ⴷ', 'ⵏ', 'ⵀ', 'ⵜ', 'ⵔ'], triggerChance: 1.0 }
            }
        };

        // アプリケーション状態
        let currentProfile = JSON.parse(JSON.stringify(DEFAULT_PROFILE));
        let rawContent = "";
        let currentMode = null; // 'hiragana' | 'tifinagh'
        let currentInkColor = "#1c1917";
        let isFitMode = true;

        // DOM要素
        const dropZone = document.getElementById('drop-zone');
        const rawFileInput = document.getElementById('raw-file-input');
        const profileFileInput = document.getElementById('profile-file-input');
        const resetProfileBtn = document.getElementById('reset-profile-btn');
        const developBtn = document.getElementById('develop-btn');
        const printBtn = document.getElementById('print-btn');
        const exportTxtBtn = document.getElementById('export-txt-btn');
        const outputText = document.getElementById('output-text');
        const paperSheet = document.getElementById('paper-sheet');
        const detectedModeSpan = document.getElementById('detected-mode');
        const profileNameSpan = document.getElementById('profile-name');
        const pagePrintStyle = document.getElementById('page-print-style');

        // 表示倍率コントロール
        const btnViewFit = document.getElementById('btn-view-fit');
        const btnViewActual = document.getElementById('btn-view-actual');
        const paperTransformWrap = document.getElementById('paper-transform-wrap');
        const workbench = document.getElementById('workbench');

        // 仕立て・組版コントロール
        const selectPaperSize = document.getElementById('select-paper-size');
        const selectMargin = document.getElementById('select-margin');
        const selectPaperBg = document.getElementById('select-paper-bg');
        const selectFont = document.getElementById('select-font');
        const selectDirection = document.getElementById('select-direction');
        const customInkColor = document.getElementById('custom-ink-color');
        const colorChips = document.querySelectorAll('.color-chip');

        const sliderSize = document.getElementById('slider-size');
        const sliderLeading = document.getElementById('slider-leading');
        const sliderTracking = document.getElementById('slider-tracking');

        const valSize = document.getElementById('val-size');
        const valLeading = document.getElementById('val-leading');
        const valTracking = document.getElementById('val-tracking');

        // 用紙・組版スタイル更新ハンドラ
        function updateSheetLayout() {
            // 用紙クラスの適用
            paperSheet.className = `paper-sheet ${selectPaperSize.value} ${selectFont.value} ${selectDirection.value}`;
            paperSheet.style.padding = selectMargin.value;
            paperSheet.style.backgroundColor = selectPaperBg.value;
            paperSheet.style.color = currentInkColor;

            // テキストスタイル
            outputText.style.fontSize = `${sliderSize.value}pt`;
            outputText.style.lineHeight = (sliderLeading.value / 10).toFixed(1);
            outputText.style.letterSpacing = `${sliderTracking.value}px`;

            valSize.innerText = `${sliderSize.value}pt`;
            valLeading.innerText = (sliderLeading.value / 10).toFixed(1);
            valTracking.innerText = `${sliderTracking.value}px`;

            // 印刷用 @page サイズの動的切り替え
            updatePagePrintRule(selectPaperSize.value);

            // 表示スケールの再計算
            updateViewScale();
        }

        function updatePagePrintRule(sizeKey) {
            let pageRule = '@page { size: A4 portrait; margin: 0; }';
            if (sizeKey === 'size-a4-l') pageRule = '@page { size: A4 landscape; margin: 0; }';
            else if (sizeKey === 'size-hagaki-p') pageRule = '@page { size: 100mm 148mm; margin: 0; }';
            else if (sizeKey === 'size-hagaki-l') pageRule = '@page { size: 148mm 100mm; margin: 0; }';
            pagePrintStyle.innerHTML = pageRule;
        }

        function updateViewScale() {
            if (!isFitMode) {
                paperTransformWrap.style.transform = 'scale(1)';
                return;
            }

            // 作業台の高さに合わせて用紙を自動縮小
            const workbenchHeight = workbench.clientHeight - 80;
            const sheetHeight = paperSheet.offsetHeight || 842;
            const scale = Math.min(1, workbenchHeight / sheetHeight);

            paperTransformWrap.style.transform = `scale(${scale.toFixed(2)})`;
        }

        // 表示倍率切り替えイベント
        btnViewFit.addEventListener('click', () => {
            isFitMode = true;
            btnViewFit.classList.add('active');
            btnViewActual.classList.remove('active');
            updateViewScale();
        });

        btnViewActual.addEventListener('click', () => {
            isFitMode = false;
            btnViewActual.classList.add('active');
            btnViewFit.classList.remove('active');
            updateViewScale();
        });

        window.addEventListener('resize', () => {
            if (isFitMode) updateViewScale();
        });

        // イベントリスナー登録
        selectPaperSize.addEventListener('change', updateSheetLayout);
        selectMargin.addEventListener('change', updateSheetLayout);
        selectPaperBg.addEventListener('change', updateSheetLayout);
        selectFont.addEventListener('change', updateSheetLayout);
        selectDirection.addEventListener('change', updateSheetLayout);

        sliderSize.addEventListener('input', updateSheetLayout);
        sliderLeading.addEventListener('input', updateSheetLayout);
        sliderTracking.addEventListener('input', updateSheetLayout);

        // インク色プリセット選択
        colorChips.forEach(chip => {
            chip.addEventListener('click', () => {
                colorChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentInkColor = chip.dataset.color;
                customInkColor.value = currentInkColor;
                updateSheetLayout();
            });
        });

        // カスタムカラーピッカー
        customInkColor.addEventListener('input', (e) => {
            colorChips.forEach(c => c.classList.remove('active'));
            currentInkColor = e.target.value;
            updateSheetLayout();
        });

        // ドラッグ＆ドロップ設定
        dropZone.addEventListener('click', () => rawFileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleRawFile(e.dataTransfer.files[0]);
        });
        rawFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleRawFile(e.target.files[0]);
                rawFileInput.value = '';
            }
        });

        // RAWテキスト解析
        function handleRawFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result.trim();
                const pureHiragana = text.replace(/[^ぁ-ん]/g, '');
                const pureTifinagh = text.replace(/[^\u2D30-\u2D7F]/g, '');

                if (pureHiragana.length >= pureTifinagh.length && pureHiragana.length > 0) {
                    currentMode = 'hiragana';
                    rawContent = pureHiragana;
                    detectedModeSpan.innerText = `Hiragana (${rawContent.length} chars)`;
                    if (selectFont.value === 'font-tifinagh') selectFont.value = 'font-shippori';
                } else if (pureTifinagh.length > 0) {
                    currentMode = 'tifinagh';
                    rawContent = pureTifinagh;
                    detectedModeSpan.innerText = `Tifinagh (${rawContent.length} chars)`;
                    selectFont.value = 'font-tifinagh';
                } else {
                    alert('有効なHeteroGraph RAWテキストデータが検出されませんでした。');
                    return;
                }

                updateSheetLayout();
                developBtn.disabled = false;
                developText();
            };
            reader.readAsText(file);
        }

        // プロファイル読込
        profileFileInput.addEventListener('change', (e) => {
            if (!e.target.files.length) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const json = JSON.parse(ev.target.result);
                    currentProfile = json;
                    profileNameSpan.innerText = json.profileName || "Custom Profile";
                    if (rawContent) developText();
                } catch (err) {
                    alert('無効なJSONプロファイルです: ' + err.message);
                }
            };
            reader.readAsText(e.target.files[0]);
            profileFileInput.value = '';
        });

        // プロファイルリセット
        resetProfileBtn.addEventListener('click', () => {
            currentProfile = JSON.parse(JSON.stringify(DEFAULT_PROFILE));
            profileNameSpan.innerText = currentProfile.profileName;
            profileFileInput.value = '';
            if (rawContent) developText();
        });

        // 現像実行
        developBtn.addEventListener('click', developText);

        function developText() {
            if (!rawContent || !currentMode) return;

            // Core Engine を呼び出して整形結果を取得
            const result = HeteroGraphCore.develop(rawContent, currentMode, currentProfile);

            outputText.innerText = result;
            exportTxtBtn.disabled = false;
        }

        // 印刷 / PDF出力
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // テキスト保存
        exportTxtBtn.addEventListener('click', () => {
            const text = outputText.innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `developed_${currentMode}_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // 初期レイアウト適用
        updateSheetLayout();
    </script>
</body>
</html>
